services:
  postgres:
    image: postgres:18.6-alpine3.24
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-planly}
      POSTGRES_USER: ${POSTGRES_USER:-planly}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-planly_dev}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 15
      start_period: 5s

  migrate:
    image: planly-api:local
    command: ["/app/planly-migrate", "up"]
    environment:
      DATABASE_URL: "postgres://${POSTGRES_USER:-planly}:${POSTGRES_PASSWORD:-planly_dev}@postgres:5432/${POSTGRES_DB:-planly}?sslmode=disable"
    depends_on:
      postgres:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: "no"

  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: planly-api:local
    environment:
      HTTP_ADDR: ":8080"
      DATABASE_URL: "postgres://${POSTGRES_USER:-planly}:${POSTGRES_PASSWORD:-planly_dev}@postgres:5432/${POSTGRES_DB:-planly}?sslmode=disable"
      APP_ORIGIN: ${APP_ORIGIN:-http://localhost:5173}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    ports:
      - "127.0.0.1:${API_PORT:-8080}:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/ready"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 10s

volumes:
  postgres_data:
